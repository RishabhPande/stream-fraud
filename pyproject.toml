[project]
name = "stream-fraud"
version = "0.1.0"
description = "Real-time transaction scoring pipeline demo: simulated stream, sliding-window velocity features, risk scorer, drift detection"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
